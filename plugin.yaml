name: hermes-boot-screen
version: "1.1.1"
description: "Six-act boot animation for the Hermes desktop app: black-screen brand reveal, over-exposed whiteout bridge, authorization handshake with identity confirmation, and a welcome finale — with audio cues, theme-aware light/dark plates and Esc/Enter/Space controls. Desktop-only: desktop/plugin.js inside the plugin SDK surface; no agent tools, hooks, middleware or env vars. Config (identity name, playback mode, speed, sound) lives in the plugin's own storage; no network calls, no telemetry."
